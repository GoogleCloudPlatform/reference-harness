steps:
  # Run unit tests
  - name: "python:3.12-slim"
    entrypoint: bash
    args:
      - -c
      - |
        pip install uv
        uv sync --frozen
        uv run pytest tests/unit -v

  # Build container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg=COMMIT_SHA=$COMMIT_SHA"
      - "--build-arg=AGENT_VERSION=$TAG_NAME"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vulncatcher:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vulncatcher:latest"
      - "."

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vulncatcher"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - "gcloud"
      - "run"
      - "deploy"
      - "vulncatcher"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vulncatcher:$COMMIT_SHA"
      - "--region=${_REGION}"
      - "--project=$PROJECT_ID"

substitutions:
  _REGION: us-central1
  _REPO: vulncatcher

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vulncatcher"
