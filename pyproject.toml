[project]
name = "rh"
version = "1.4"
description = "Reference Harness Security Audit Engine — Automating discovery, validation, and remediation of codebase vulnerabilities."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Google LLC"},
]
dependencies = [
    "google-adk>=1.15.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-storage>=2.15.0,<4.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-java>=0.22.0",
    "tree-sitter-go>=0.22.0",
    "tree-sitter-c>=0.22.0",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-json>=0.24.8",
    "rich>=15.0.0",
    "google-agents-cli>=0.2.0",
]
requires-python = ">=3.11,<3.14"

[project.scripts]
rh = "app.cli.main:entry_point"


[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "pytest-asyncio>=0.23.8,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=1.15.0,<2.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge,SME"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json,./eval-fixtures/*,*evalset_result.json,./reports/*,./app/.adk"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]

